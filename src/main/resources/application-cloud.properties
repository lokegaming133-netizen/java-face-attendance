# Cloud-only settings; default profile still uses local H2.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# Use Render environment variables, never commit passwords.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:neondb}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&channelBinding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# The original schema.sql remains H2-only. Run this instead in cloud.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
