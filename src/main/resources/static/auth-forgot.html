<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Forgot password · FaceAttend</title><link rel="stylesheet" href="/auth-pages.css"></head>
<body><main><div class="top">Account recovery · __ROLE_NAME__ Portal</div><div class="brand">Face<em>Attend</em></div><h1>Forgot password?</h1><p>Enter your <strong>registered email</strong>. If an active __ROLE_NAME__ account exists, we'll email a 6-digit reset code.</p><p class="notice" id="notice" role="status"></p>
<form method="post" action="/auth/forgot"><!--LOGIN_CSRF_FIELD--><input name="loginRole" type="hidden" value="__ROLE__"><label for="email">Registered email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@university.edu" maxlength="254" required><button class="primary" type="submit">Send password reset code →</button></form>
<p class="help">For privacy, this page never reveals whether an email belongs to an account.</p><footer><a href="/login">All portals</a><a href="/login/__ROLE_ROUTE__" id="back">Back to sign-in</a></footer></main>
<script>const q=new URLSearchParams(location.search);if(q.has('expired')){const m=document.getElementById('notice');m.textContent='Recovery session expired. Start again.';m.classList.add('show')}document.getElementById('back').href='/login/'+('__ROLE__'==='ADMIN'?'admin':'__ROLE__'==='STUDENT'?'student':'teacher');</script></body></html>
