<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Verify email · FaceAttend</title><link rel="stylesheet" href="/auth-pages.css"></head>
<body><main><div class="top">Secure access · __ROLE_NAME__ Portal</div><div class="brand">Face<em>Attend</em></div><h1>Check your email</h1><p>We sent a real 6-digit sign-in code to <strong>__MASKED_EMAIL__</strong>. Valid for 5 minutes.</p><p class="notice" id="notice" role="status"></p>
<form method="post" action="/auth/verify"><!--LOGIN_CSRF_FIELD--><label for="code">6-digit verification code</label><input class="otp-number" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required><button class="primary" type="submit">Verify and open __ROLE_NAME__ Portal →</button></form>
<form action="/auth/resend" method="post"><!--LOGIN_CSRF_FIELD--><button class="muted-btn" type="submit">Resend code</button></form>
<p class="help">If you requested another code, only the newest one will work. OTPs are not shown inside the website.</p><footer><a href="/login">All portals</a><a href="/auth/forgot?role=__ROLE__">Forgot password?</a></footer></main>
<script>const q=new URLSearchParams(location.search);const m=document.getElementById('notice');if(q.has('invalid')){m.textContent='Invalid, expired or already used code. Check and try again.';m.classList.add('show')}else if(q.has('wait')){m.textContent='Please wait 60 seconds before requesting another code. If delivery failed, ask the administrator to check SMTP.';m.classList.add('show')}else if(q.has('resent')){m.textContent='A fresh code has been sent to your registered email.';m.classList.add('show')}</script></body></html>
