*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0c1525;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{--accent:var(--sage);--rgb:167,201,190;--glyph:var(--teacher-glyph);position:relative;isolation:isolate;min-height:100vh;min-height:100svh;
 background:radial-gradient(ellipse at 79% 12%,#22324e 0,transparent 49%),radial-gradient(ellipse at 8% 88%,#182740 0,transparent 45%),#0c1525}
body[data-kind=STUDENT]{--accent:var(--lilac);--rgb:194,182,250;--glyph:var(--student-glyph)}
body[data-kind=ADMIN]{--accent:var(--gold);--rgb:232,204,150;--glyph:var(--admin-glyph)}
body::before{content:"";position:absolute;pointer-events:none;inset:0;z-index:-1;background:var(--grain) repeat;opacity:.045}
[hidden]{display:none!important}a{color:inherit;text-decoration:none}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.sr,.skip-content:not(:focus){position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip-content:focus{position:fixed;top:10px;left:10px;z-index:5;background:#203149;padding:12px}
.shell{width:min(100% - clamp(34px,10vw,160px),1200px);margin:auto;padding-bottom:clamp(26px,6vh,72px)}

.preferences{display:flex;align-items:center;gap:13px}.theme{display:inline-flex;gap:4px;align-items:center;color:#dce1eb}
.theme i{width:14px;height:14px;border:1.3px solid currentColor;border-radius:50%;background:linear-gradient(90deg,#c4cfe0 50%,transparent 50%)}
.theme select{font-size:12px;border:0;background:transparent;padding:8px 2px}.theme option{background:#162337}
.motion{display:grid;place-items:center;width:35px;height:35px;border:1px solid #8294af69;border-radius:50%;background:#ffffff05}
.motion i{width:8px;height:10px;border:solid #ced9e7;border-width:0 2px}
.paused .motion i{width:0;height:0;border:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid #ced9e7;margin-left:2px}
main{max-width:1060px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;margin:clamp(12px,2.3vh,25px) 0 11px;padding:3px 0;color:#bdc9dc;font-size:12px;font-weight:550}
.back:hover{color:white}.back span{font-size:18px;line-height:1}
.role-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.15vw,17px)}
.role{--own:#a7c9be;--own-rgb:167,201,190;--symbol:var(--teacher-glyph);display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;min-width:0;
 border:1px solid #34435c;border-radius:15px;padding:clamp(13px,1.45vw,21px);min-height:clamp(110px,15.8vh,146px);
 background:radial-gradient(ellipse at 5% 0%,rgba(var(--own-rgb),.08),transparent 64%),linear-gradient(125deg,#182438,#131e30 80%);
 transition:transform .25s,border-color .25s,box-shadow .25s;}
.role.student{--own:var(--lilac);--own-rgb:194,182,250;--symbol:var(--student-glyph)}
.role.admin{--own:var(--gold);--own-rgb:232,204,150;--symbol:var(--admin-glyph)}
.role::before{content:"";height:1px;position:absolute;left:5%;right:31%;top:0;background:linear-gradient(90deg,transparent,rgba(var(--own-rgb),.57),transparent)}
.role::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(ellipse at 15% 0,rgba(var(--own-rgb),.17),transparent 74%);transition:opacity .28s}
.role:hover,.role:focus-visible{transform:translateY(-3px);border-color:rgba(var(--own-rgb),.60);box-shadow:0 10px 22px #02071233}
.role:hover::after,.role:focus-visible::after,.role[aria-current="page"]::after{opacity:1}
.role[aria-current="page"]{border-color:rgba(var(--own-rgb),.65)}
.role-top{display:flex;justify-content:space-between;align-items:flex-start}.role-icon{display:grid;place-items:center;width:clamp(31px,2.8vw,42px);height:clamp(31px,2.8vw,42px);border-radius:11px;background:rgba(var(--own-rgb),.105);border:1px solid rgba(var(--own-rgb),.24);color:var(--own)}
.glyph{display:block;width:59%;height:59%;background:currentColor;mask:var(--symbol) center/contain no-repeat;-webkit-mask:var(--symbol) center/contain no-repeat}
.north{width:16px;height:16px;position:relative;color:#a9b8cd;margin:2px}
.north::before{content:"";position:absolute;right:1px;top:1px;width:9px;height:9px;border:solid currentColor;border-width:1.3px 1.3px 0 0}
.north::after{content:"";position:absolute;right:1px;top:1px;width:14px;height:1.4px;background:currentColor;transform-origin:right;transform:rotate(-45deg)}
.role strong{font-size:clamp(18px,1.55vw,25px);letter-spacing:-.055em;font-weight:600;line-height:1.1;margin:clamp(10px,1.4vh,17px) 0 4px}
.role small{font-size:clamp(11px,.95vw,14px);color:#bcc7d8;line-height:1.4}
.credentials{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1.05fr;overflow:hidden;min-width:0;margin-top:clamp(17px,2.6vh,28px);border:1px solid #42526a;border-radius:clamp(16px,1.55vw,24px);
 background:linear-gradient(115deg,#19273c 0,#162237 46%,#131f32 100%);box-shadow:0 28px 80px #0409115c,inset 0 1px #d2e1ff0b}
.credentials::before{content:"";position:absolute;z-index:2;pointer-events:none;left:4%;width:68%;height:1px;top:0;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.82),transparent)}
.identity{position:relative;isolation:isolate;min-height:clamp(318px,40vh,430px);padding:clamp(25px,3.8vw,61px);display:flex;align-items:flex-start;overflow:hidden;background:radial-gradient(ellipse at 4% 3%,rgba(var(--rgb),.065),transparent 61%)}
.identity::after{content:"";position:absolute;right:0;top:9%;bottom:9%;width:1px;background:linear-gradient(transparent,#8696b44d 16%,#8696b44d 84%,transparent)}
.identity-text{position:relative;z-index:1}.kicker{display:flex;align-items:center;gap:9px;color:var(--accent);font-size:clamp(8px,.67vw,11px);font-weight:650;text-transform:uppercase;letter-spacing:.18em;margin:0}
.kicker i{width:24px;height:1px;background:var(--accent)}
h1{position:relative;font-size:clamp(54px,5.6vw,85px);font-weight:550;letter-spacing:-.08em;line-height:.93;margin:18px 0 12px;max-width:100%;text-wrap:balance}
h1 em{display:block;font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.072em;line-height:.97;color:var(--accent)}#title:focus{outline:none}
.purpose{font-size:clamp(13px,1.05vw,16px);line-height:1.53;color:#bdcadc;margin:0;max-width:31ch}
.arch{pointer-events:none;position:absolute;z-index:-1;right:-16%;bottom:-39%;width:56%;height:102%;border:1px solid rgba(var(--rgb),.15);border-radius:50% 50% 0 0 / 38% 38% 0 0;transform:rotate(26deg);box-shadow:0 0 0 7px #ffffff02,0 0 0 8px rgba(var(--rgb),.08),0 0 0 26px #ffffff01,0 0 0 27px rgba(var(--rgb),.055)}

.password-field button{flex:none;margin:0 6px 0 0;padding:6px 9px;min-height:32px;color:var(--accent);border:0;background:transparent;font-size:12px;font-weight:650;border-radius:4px}
.sign{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:clamp(45px,6vh,55px);padding:10px 16px;margin-top:3px;border:1px solid rgba(var(--rgb),.85);border-radius:9px;font:inherit;font-size:14px;font-weight:700;
 color:#101a29;background:linear-gradient(112deg,rgba(var(--rgb),.98),rgba(var(--rgb),.86));box-shadow:inset 0 1px #ffffff4d;transition:filter .16s,transform .16s}
.sign:hover,.sign:focus-visible{filter:brightness(1.09)}.sign:active{transform:translateY(1px)}.sign span{font-size:22px;line-height:1;font-weight:400}
.note,.error{font-size:12px;line-height:1.5}.note{color:var(--dim);margin:11px 0 0}.error{border-left:2px solid #eba89e;background:#452d35;color:#ffd7d0;padding:9px 12px;margin:0 0 13px;border-radius:4px}
.arrive .credentials{animation:card-in .60s cubic-bezier(.16,.79,.23,1) both}.arrive .form-col{animation:form-in .5s .10s ease-out both}.arrive .credentials::before{animation:edge-in .9s ease-out both}
@keyframes card-in{from{opacity:.24;transform:perspective(950px) translateY(12px) rotateX(3deg)}to{opacity:1;transform:none}}
@keyframes form-in{from{opacity:.12;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes edge-in{from{transform:scaleX(.2);opacity:0;transform-origin:left}to{transform:scaleX(1);opacity:1;transform-origin:left}}
.motion-on .engraving{animation:engrave 62s linear infinite}@keyframes engrave{to{transform:rotate(360deg)}}
.paused *,.paused *::before,.paused *::after{animation:none!important;transition:none!important}

@media(max-width:760px){.shell{width:calc(100% - 32px);padding-bottom:26px}.topbar{min-height:62px}.wordmark{font-size:21px;gap:8px}.brand-mark{width:25px;height:25px}.preferences{gap:8px}.back{margin:12px 0 9px}
 .role-options{gap:7px}.role{padding:10px;min-height:88px;border-radius:11px}.role-icon{width:28px;height:28px;border-radius:8px}.north{width:12px;height:12px;margin:1px}.north::before{width:6px;height:6px}.north::after{width:9px}.role strong{font-size:17px;margin:8px 0 1px}.role small{font-size:10px}
 .credentials{grid-template-columns:1fr;margin-top:14px}.identity{min-height:0;padding:22px 23px 19px}.identity::after{top:auto;left:23px;right:23px;bottom:0;height:1px;width:auto;background:linear-gradient(90deg,rgba(var(--rgb),.38),transparent 90%)}
 h1{font-size:clamp(39px,7.5vw,59px);margin:11px 0 6px}h1 em{display:inline;white-space:nowrap}.kicker{font-size:8px}.kicker i{width:16px}.purpose{font-size:13px;max-width:36ch;padding-right:20px}.emblem{width:50px;right:3.3%;bottom:10%;opacity:.32}.arch{width:30%;height:155%;right:-8%;bottom:-73%}.form-col{padding:19px 23px 23px}.fields label{font-size:12px}.field{margin:6px 0 13px}
}

.shell{padding-bottom:clamp(18px,4vh,56px)}
body[data-view="chooser"] .shell,body[data-view="role"] .shell{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.topbar{flex:none}.shell main{width:min(100%,1060px);flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;padding:clamp(24px,6vh,75px) 0}
#choose-screen,#role-screen{min-width:0}#choose-screen:focus,.role-options:focus{outline:none}
.role-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,18px)}
.role-options .role{min-height:clamp(138px,22vh,208px);padding:clamp(16px,2vw,29px);border-radius:clamp(14px,1.4vw,21px)}
.role-options .role-top{flex:1}.role-options .role strong{margin-top:17px}
.role-options .role-icon{width:clamp(34px,3.5vw,49px);height:clamp(34px,3.5vw,49px)}
.role-options .role strong{font-size:clamp(21px,1.9vw,29px)}.role-options .role small{font-size:clamp(12px,1.03vw,15px)}
#role-screen .back{margin:0 0 12px}#role-screen .credentials{margin:0}
#role-screen .identity{min-height:clamp(322px,45vh,474px)}
.notice{padding:11px 14px;margin:0 0 14px;color:#e7d7b8;border:1px solid #bb9c655e;border-radius:10px;background:#25262d;font-size:14px}
.replay-head{border:1px solid #8597b25e;border-radius:99px;background:#ffffff05;padding:8px 12px;color:#d9e4f4;font-size:12px;line-height:1.2;min-height:35px;display:inline-flex;align-items:center;gap:7px}
.replay-head:hover,.enter-now:hover{background:#ffffff10}.replay-head i{display:block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid currentColor}
.portal-opening{--gate-time:4500ms;--tone:#a7c9be;--gate-rgb:167,201,190;--portal-icon:var(--teacher-glyph);color:#f5f5f8;color-scheme:dark;
 border:0;border-radius:0;margin:0;inset:0;padding:0;position:fixed;width:100%;max-width:none;height:100%;max-height:none;overflow:hidden;z-index:30;
 background:radial-gradient(ellipse at 50% 38%,#20324c 0,#131e30 40%,#0a1322 84%)}
.portal-opening[open]{display:grid;place-items:center}.portal-opening::backdrop{background:#0b1424}
.portal-opening[data-role="student"]{--tone:#c2b6fa;--gate-rgb:194,182,250;--portal-icon:var(--student-glyph)}
.portal-opening[data-role="admin"]{--tone:#e8cc96;--gate-rgb:232,204,150;--portal-icon:var(--admin-glyph)}
.gate-background{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(var(--gate-rgb),.12),transparent 54%)}
.gate-background::before{content:"";position:absolute;inset:0;background:var(--grain) repeat;opacity:.04}
.gate-background::after{content:"";position:absolute;inset:clamp(9px,2.5vmin,26px);border:1px solid rgba(var(--gate-rgb),.13);border-radius:10px}
.gate-center{position:relative;z-index:1;text-align:center;padding:24px;min-width:0;max-width:100%;display:grid;justify-items:center;align-content:center;gap:clamp(20px,3vh,34px)}
.gate-medallion{position:relative;width:clamp(100px,15vmin,174px);aspect-ratio:1;display:grid;place-items:center;isolation:isolate;color:var(--tone)}
.outer-orbit,.inner-orbit,.gate-ring{position:absolute;border-radius:50%;pointer-events:none}
.outer-orbit{inset:-1.5%;border:1px solid rgba(var(--gate-rgb),.19);border-top-color:var(--tone);border-right-color:rgba(var(--gate-rgb),.52);box-shadow:0 0 18px rgba(var(--gate-rgb),.055)}
.inner-orbit{inset:4%;background:repeating-conic-gradient(from 4deg,rgba(var(--gate-rgb),.64) 0 1deg,transparent 1deg 10deg);mask:radial-gradient(transparent 62%,#000 64%,#000 69%,transparent 70%);-webkit-mask:radial-gradient(transparent 62%,#000 64%,#000 69%,transparent 70%)}
.gate-ring{inset:13%;border:1px solid rgba(var(--gate-rgb),.6);box-shadow:inset 0 0 0 4px #162236,inset 0 0 0 5px rgba(var(--gate-rgb),.22),0 0 30px rgba(var(--gate-rgb),.13);background:radial-gradient(at 30% 22%,rgba(var(--gate-rgb),.17),#131e30 72%)}
.gate-glyph{width:38%;height:38%;background:currentColor;mask:var(--portal-icon) center/contain no-repeat;-webkit-mask:var(--portal-icon) center/contain no-repeat;z-index:1}
#gate-title{margin:0;font-family:var(--sans);font-weight:520;font-size:clamp(33px,4.9vw,82px);letter-spacing:-.068em;line-height:1.12;text-wrap:balance}
#gate-title em{font-family:var(--serif);color:var(--tone);font-weight:400}
.gate-meter{width:clamp(140px,23vw,300px);height:2px;background:rgba(var(--gate-rgb),.18);border-radius:5px;overflow:hidden}
.gate-meter i{display:block;width:100%;height:100%;background:linear-gradient(90deg,rgba(var(--gate-rgb),.35),var(--tone));transform-origin:left}
.enter-now{position:absolute;z-index:3;right:clamp(19px,4vw,66px);top:clamp(18px,4vh,48px);min-height:38px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid #9db1ce70;background:#142036;color:#e7edf8;font-size:12px;font-weight:600}
.gate-edge{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 transparent}
.portal-opening[open] .outer-orbit{animation:gate-orbit var(--gate-time) cubic-bezier(.22,.55,.24,1) both}
.portal-opening[open] .inner-orbit{animation:gate-dial var(--gate-time) ease-out both}
.portal-opening[open] .gate-medallion{animation:seal-focus var(--gate-time) cubic-bezier(.22,.73,.19,1) both}
.portal-opening[open] .gate-meter i{animation:gate-progress var(--gate-time) linear both}
.portal-opening[open] .gate-edge{animation:gate-light var(--gate-time) ease-in-out both}
@keyframes gate-orbit{0%{transform:rotate(-155deg)}100%{transform:rotate(215deg)}}
@keyframes gate-dial{0%{transform:rotate(60deg)}100%{transform:rotate(-74deg)}}
@keyframes seal-focus{0%{transform:perspective(650px) rotateY(-28deg) scale(.79);opacity:.6}18%{transform:perspective(650px) rotateY(0) scale(1);opacity:1}79%{transform:scale(1)}100%{transform:scale(1.07)}}
@keyframes gate-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gate-light{0%,68%{box-shadow:inset 0 0 0 0 transparent}100%{box-shadow:inset 0 0 115px 10px rgba(var(--gate-rgb),.12)}}
.portal-opening.suspended *,.portal-opening.suspended *::before,.portal-opening.suspended *::after{animation-play-state:paused!important}
body.paused .gate-meter{visibility:hidden}
@media(max-width:760px){
 .shell main{padding:22px 0}.preferences{gap:8px}.replay-head{font-size:11px;min-height:32px;padding:6px 9px}
 .role-options{grid-template-columns:1fr;gap:10px}.role-options .role{min-height:79px;display:grid;align-content:center;grid-template-columns:41px minmax(0,1fr) 16px;grid-template-rows:auto auto;column-gap:13px;padding:14px 17px;border-radius:13px}
 .role-options .role-top{display:contents}.role-options .role-icon{grid-column:1;grid-row:1/3;align-self:center;width:39px;height:39px}
 .role-options .north{grid-column:3;grid-row:1/3;align-self:center}
 .role-options .role strong{grid-column:2;grid-row:1;margin:0 0 3px;font-size:21px}
 .role-options .role small{display:block;grid-column:2;grid-row:2;font-size:12px}
 #role-screen .identity{min-height:0}.gate-center{gap:25px}
}
@media(max-width:405px){.replay-head{width:32px;height:32px;justify-content:center;padding:0}.replay-head span{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.theme select{max-width:87px}.wordmark{font-size:20px}.preferences{gap:6px}}
@media(max-height:620px) and (min-width:761px){.shell main{padding:14px 0}#role-screen .identity{min-height:268px}.role-options .role{min-height:125px}}
@media(prefers-reduced-motion:reduce){.gate-meter{visibility:hidden}}
</style></head>
<body data-mode="role" data-view="role" data-kind="__ROLE_KIND__">
<a id="skip-content" class="skip-content" href="#username">Go to sign-in</a>
<div class="shell"><header class="topbar">
   <a class="wordmark" id="home" href="/login"><span class="brand-mark" aria-hidden="true"></span><span>Face<span>Attend</span></span></a>
   <div class="preferences">
    <label class="theme" hidden><i aria-hidden="true"></i><span class="sr">Dashboard theme</span><select id="theme"><option value="sunshine">Sunshine</option><option value="neo">FaceAttend</option></select></label>
    <button id="motion" class="motion" type="button" aria-label="Pause motion" title="Pause motion" hidden><i aria-hidden="true"></i></button>
   </div>
  </header><main><div id="role-screen"><a class="back" id="back" href="/login"><span aria-hidden="true">←</span> All portals</a><section class="credentials" id="credentials" aria-labelledby="title">
    <div class="identity">
     <div class="arch" aria-hidden="true"></div>
     <div class="identity-text">
      <p class="kicker"><i aria-hidden="true"></i>University attendance</p>
      <h1 id="title" tabindex="-1">__ROLE_TITLE__</h1>
      <p class="purpose" id="purpose">__ROLE_DESCRIPTION__</p>
     </div>
     <div class="emblem" aria-hidden="true"><span class="engraving"></span><span class="insignia"><i></i></span></div>
    </div>
    <div class="form-col">
     <p class="error" id="login-error" role="alert" hidden>Email, password, or portal is incorrect. Please try again.</p>
     <form method="post" action="/auth/start" autocomplete="on" class="fields">
      <!--LOGIN_CSRF_FIELD--><input type="hidden" name="loginRole" value="__ROLE_KIND__">
      <label for="username">Registered email</label>
      <div class="field user-field"><span class="field-icon" aria-hidden="true"></span><input id="username" name="username" type="email" placeholder="Enter your registered email" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <label for="password">Password</label>
      <div class="field password-field"><span class="field-icon" aria-hidden="true"></span><input id="password" type="password" name="password" minlength="12" required autocomplete="current-password"><button type="button" id="show" aria-controls="password" aria-pressed="false" hidden>Show</button></div>
      <a href="/auth/forgot?role=__ROLE_KIND__" style="display:inline-block;color:#d9dcfb;font-weight:700;margin:8px 0 14px;text-decoration:underline;text-underline-offset:4px">Forgot password?</a>
      <button class="sign" type="submit"><b id="submit-label">Sign in</b><span aria-hidden="true">→</span></button>
     </form>
     
    </div>
   </section></div></main></div>

<dialog id="portal-opening" class="portal-opening" aria-labelledby="gate-title">
  <div class="gate-background" aria-hidden="true"></div>
  <button id="enter-now" class="enter-now" type="button">Enter now <span aria-hidden="true">→</span></button>
  <div class="gate-center">
    <div class="gate-medallion" aria-hidden="true"><i class="outer-orbit"></i><i class="inner-orbit"></i><i class="gate-ring"></i><i class="gate-glyph"></i></div>
    <h2 id="gate-title">Opening <em id="gate-name">Teacher</em> Portal</h2>
    <div class="gate-meter" aria-hidden="true"><i></i></div>
  </div>
  <i class="gate-edge" aria-hidden="true"></i>
</dialog>

<script>
(()=>{'use strict';
const byId=id=>document.getElementById(id);
const body=document.body;
const preview=body.dataset.mode==='preview';
const chooser=byId('choose-screen'), credentials=byId('role-screen');
const media=window.matchMedia('(prefers-reduced-motion: reduce)');
const roleNames={
 teacher:{name:'Teacher',kind:'FACULTY',user:'teacher',description:'Take attendance, run camera, and review assigned classes.'},
 student:{name:'Student',kind:'STUDENT',user:'student.demo',description:'View your personal attendance and subject percentages.'},
 admin:{name:'Admin',kind:'ADMIN',user:'admin',description:'Manage accounts, students, faculty, classes, and attendance.'}
};
const byKind={FACULTY:'teacher',STUDENT:'student',ADMIN:'admin'};
const gate=byId('portal-opening'),film=byId('opening');
const ROLE_OPEN_MS=4500, ARRIVED='#faceattend-ready';
const params=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function getSetting(store,key){try{return window[store].getItem(key);}catch{return null;}}
function putSetting(store,key,value){try{window[store].setItem(key,value);}catch{}}
let paused=getSetting('localStorage','faceattend_optics_paused_v1')==='1';
const motionAllowed=()=>!media.matches&&!paused;
let current=null, pendingGate=null, navigationCommitted=false, arrivalTimer=0;
let filmStart=null,filmFrame=0,filmFade=0,filmEnd=0,fromReplay=false;
let renderer=null,rendererTried=false,lastFilmDraw=0;

function openDialog(dialog){
 try{dialog.showModal();}catch{dialog.setAttribute('open','');}
}
function closeDialog(dialog){
 if(typeof dialog.close==='function'&&dialog.open)dialog.close();else dialog.removeAttribute('open');
}
function elapsedNow(job){
 return Math.min(ROLE_OPEN_MS,job.elapsed+(job.since===null?0:Math.max(0,performance.now()-job.since)));
}
function settleGate(){
 const job=pendingGate;if(!job)return null;
 pendingGate=null;clearTimeout(job.timer);gate.classList.remove('suspended');closeDialog(gate);
 return job;
}
function completeGate(){
 const job=settleGate();if(job)job.finish();
}
function scheduleGate(){
 const job=pendingGate;if(!job||document.hidden||job.since!==null)return;
 gate.classList.remove('suspended');job.since=performance.now();
 job.timer=setTimeout(()=>{
  if(pendingGate!==job)return;
  job.elapsed=elapsedNow(job);job.since=null;
  if(job.elapsed>=ROLE_OPEN_MS)completeGate();else scheduleGate();
 },Math.max(0,ROLE_OPEN_MS-job.elapsed));
}
function holdGate(){
 const job=pendingGate;if(!job)return;
 job.elapsed=elapsedNow(job);job.since=null;clearTimeout(job.timer);gate.classList.add('suspended');
}
function startGate(role,finish,cancel){
 if(pendingGate||navigationCommitted)return;
 gate.dataset.role=role;byId('gate-name').textContent=roleNames[role].name;
 gate.style.setProperty('--gate-time',ROLE_OPEN_MS+'ms');
 pendingGate={elapsed:0,since:null,timer:0,finish,cancel};
 openDialog(gate);byId('enter-now').focus({preventScroll:true});
 if(document.hidden)holdGate();else scheduleGate();
}
byId('enter-now').addEventListener('click',completeGate);
gate.addEventListener('cancel',e=>{
 e.preventDefault();const job=settleGate();if(job)job.cancel();
});

function hidePassword(){
 const pw=byId('password'),show=byId('show');
 if(!pw||!show)return;
 pw.type='password';show.textContent='Show';show.setAttribute('aria-pressed','false');show.setAttribute('aria-label','Show password');
}
const show=byId('show');
if(show){
 show.hidden=false;
 show.addEventListener('click',()=>{
  const pw=byId('password'),reveal=pw.type==='password';
  pw.type=reveal?'text':'password';show.textContent=reveal?'Hide':'Show';show.setAttribute('aria-pressed',String(reveal));show.setAttribute('aria-label',reveal?'Hide password':'Show password');
 });
}
function arrive(){
 clearTimeout(arrivalTimer);body.classList.remove('arrive');
 if(!motionAllowed())return;
 void body.offsetWidth;body.classList.add('arrive');arrivalTimer=setTimeout(()=>body.classList.remove('arrive'),940);
}
function controls(){
 body.classList.toggle('paused',!motionAllowed());body.classList.toggle('motion-on',motionAllowed());
 const btn=byId('motion'),label=motionAllowed()?'Pause motion':'Resume motion';
 btn.hidden=media.matches;btn.title=label;btn.setAttribute('aria-label',label);
 const replay=byId('replay');
 if(replay)replay.hidden=Boolean(current)||!motionAllowed()||!film||typeof film.showModal!=='function';
 if(!motionAllowed()){stopFilm(false);clearTimeout(arrivalTimer);body.classList.remove('arrive');}
}
byId('motion').addEventListener('click',()=>{paused=!paused;putSetting('localStorage','faceattend_optics_paused_v1',paused?'1':'0');controls();});
if(media.addEventListener)media.addEventListener('change',controls);else if(media.addListener)media.addListener(controls);
const theme=byId('theme');
theme.value=getSetting('localStorage','faceattend_theme_v1')==='neo'?'neo':'sunshine';
document.documentElement.dataset.faceattendTheme=theme.value;theme.parentElement.hidden=false;
theme.addEventListener('change',()=>{document.documentElement.dataset.faceattendTheme=theme.value;putSetting('localStorage','faceattend_theme_v1',theme.value);});

function renderChooser(focus=false){
 if(!chooser)return;
 current=null;body.dataset.kind='';body.dataset.view='chooser';chooser.hidden=false;
 if(credentials)credentials.hidden=true;hidePassword();
 document.title='Choose your portal · FaceAttend';byId('skip-content').href='#role-options';
 controls();if(focus)byId('role-options').focus({preventScroll:true});
}
function renderForm(role,focus=false){
 if(!credentials)return;
 current=role;const details=roleNames[role];body.dataset.kind=details.kind;body.dataset.view='role';
 if(chooser)chooser.hidden=true;credentials.hidden=false;
 const word=document.createElement('em');word.textContent='sign-in.';
 byId('title').replaceChildren(document.createTextNode(details.name+' '),word);
 document.title=details.name+' sign-in · FaceAttend';
 byId('skip-content').href='#username';
 if(preview){
  byId('username').value=details.user;byId('password').value='SampleCampusPass';
  byId('purpose').textContent=details.description;
  byId('local-link').href='http://localhost:8080/login/'+role;
  byId('submit-label').textContent='Open '+details.name.toLowerCase()+' sign-in';
 }else byId('submit-label').textContent='Sign in as '+details.name.toLowerCase();
 byId('login-error').hidden=preview||!params.has('error');
 const mailNotice=byId('login-error');
 if(!preview && (params.has('mailerror')||params.has('resetSuccess'))){mailNotice.hidden=false;mailNotice.textContent=params.has('mailerror')?'Email OTP could not be delivered. Ask the administrator to check SMTP settings.':'Password reset successful. Sign in with your new password.';}
 hidePassword();controls();arrive();
 if(focus)byId('title').focus({preventScroll:true});
}
function previewHash(){
 const name=location.hash.slice(1);
 return Object.hasOwn(roleNames,name)?name:null;
}
function openChoice(link){
 const role=link.dataset.role;
 if(!Object.hasOwn(roleNames,role))return;
 startGate(role,()=>{
  if(preview){
   if(location.hash!=='#'+role)location.hash=role;
   renderForm(role,true);
  }else{
   navigationCommitted=true;
   const destination=new URL(link.href,location.href);
   destination.hash=ARRIVED;
   try{location.assign(destination.href);}catch(error){navigationCommitted=false;link.focus();throw error;}
  }
 },()=>link.focus({preventScroll:true}));
}
if(chooser)chooser.querySelectorAll('a.role').forEach(link=>{
 if(preview)link.href='#'+link.dataset.role;
 link.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  e.preventDefault();openChoice(link);
 });
});
function previewBack(e){
 if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
 e.preventDefault();settleGate();stopFilm(false);
 if(location.hash!=='#choose')location.hash='choose';renderChooser(true);
}
if(preview){
 for(const id of ['home','back']){
  const a=byId(id);a.href='#choose';a.addEventListener('click',previewBack);
 }
 window.addEventListener('hashchange',()=>{
  const next=previewHash();
  if(next===current)return;
  settleGate();stopFilm(false);
  if(next)renderForm(next,true);else renderChooser(true);
 });
}
const status=byId('login-status');
if(status&&(params.has('logout')||params.has('roleerror'))){
 status.textContent=params.has('roleerror')?'Choose the portal that belongs to your account.':'You have signed out. Choose a role to sign in again.';
 status.hidden=false;
}

/* The original face film uses its original mesh, studio lighting, camera path and 4.6-second timing. */
function stopFilm(focus=true){
 if(filmStart===null)return;
 filmStart=null;clearTimeout(filmFade);clearTimeout(filmEnd);cancelAnimationFrame(filmFrame);filmFrame=0;
 film.classList.remove('is-ending');closeDialog(film);
 if(focus)(fromReplay?byId('replay'):byId('role-options')).focus({preventScroll:true});
}
function paintFilm(now){
 filmFrame=0;if(filmStart===null||document.hidden)return;
 const t=clamp((now-filmStart)/4600,0,1);
 const line=t<.31?'Focusing the lens':t<.74?'Tracing the face mesh':'Opening the campus portal';
 if(byId('film-line').textContent!==line)byId('film-line').textContent=line;
 if(renderer&&(!lastFilmDraw||now-lastFilmDraw>=1000/36-1)){
  lastFilmDraw=now;const stage=byId('lens-stage'),box=stage.getBoundingClientRect(),w=box.width,h=box.height;
  if(w>0&&h>0){
   const align=smooth(.06,.42,t),leave=smooth(.69,.98,t);
   const compact=Math.min(1,w/Math.max(1,h)*1.13),dpr=Math.min(window.devicePixelRatio||1,1.5,1050/h,1440/w);
   renderer.draw({width:Math.max(1,Math.round(w*dpr)),height:Math.max(1,Math.round(h*dpr)),
    yaw:1.03-1.02*align+.66*leave,pitch:-.39+.36*align-.29*leave,roll:-.29+.23*align-.05*leave,
    scale:(1.03+.25*align-.58*leave)*compact,spread:.69*(1-align)+.085+.14*leave,
    shutter:.06+.93*smooth(.09,.33,t)-.92*smooth(.68,.72,t)+.8*smooth(.72,.81,t),
    scan:clamp((t-.28)/.40,0,1),clock:-.90+.99*align-.09*leave,energy:1,tint:[.53,.72,1]});
   stage.classList.add('has-gl');
  }
 }
 filmFrame=requestAnimationFrame(paintFilm);
}
function startFilm(manual=false){
 if(!film||current||pendingGate||!motionAllowed()||filmStart!==null||typeof film.showModal!=='function')return;
 fromReplay=manual;putSetting('sessionStorage','faceattend_optics_seen_v1','1');
 byId('film-line').textContent='Focusing the lens';film.classList.remove('is-ending');openDialog(film);
 byId('skip').focus({preventScroll:true});
 if(!rendererTried){
  rendererTried=true;const fallback=()=>{renderer=null;byId('lens-stage').classList.remove('has-gl');};
  try{renderer=createOptics(byId('lens-canvas'),fallback);}catch{fallback();}
 }
 lastFilmDraw=0;filmStart=performance.now();filmFrame=requestAnimationFrame(paintFilm);
 filmFade=setTimeout(()=>film.classList.add('is-ending'),4140);filmEnd=setTimeout(()=>stopFilm(),4600);
}
if(film){
 byId('skip').addEventListener('click',()=>stopFilm());
 film.addEventListener('cancel',e=>{e.preventDefault();stopFilm();});
 byId('replay').addEventListener('click',()=>startFilm(true));
}
function directNavigation(){return (performance.getEntriesByType?.('navigation')?.[0]?.type||'navigate')==='navigate';}
function directRole(role){
 renderForm(role);
 if(location.hash===ARRIVED){
  try{history.replaceState(history.state,'',location.pathname+location.search);}catch{}
 }else if(!params.has('error')&&directNavigation()){
  const reveal=()=>{arrive();byId('title').focus({preventScroll:true});};
  startGate(role,reveal,reveal);
 }
}
if(body.dataset.mode==='role'){
 directRole(byKind[body.dataset.kind]||'teacher');
}else if(preview&&previewHash()){
 directRole(previewHash());
}else{
 renderChooser();
 if(!document.hidden&&!params.has('logout')&&!params.has('roleerror')&&!location.hash&&!getSetting('sessionStorage','faceattend_optics_seen_v1'))startFilm();
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){holdGate();stopFilm(false);}else scheduleGate();
});
window.addEventListener('pagehide',()=>{settleGate();stopFilm(false);hidePassword();navigationCommitted=false;});
window.addEventListener('pageshow',e=>{
 if(!e.persisted)return;
 navigationCommitted=false;settleGate();hidePassword();
 if(preview){const r=previewHash();if(r)renderForm(r);else renderChooser();}
});

})();
</script></body></html>
